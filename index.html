<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFRadio - Radio Latina Online en Vivo | Música, Éxitos y Entretenimiento</title>

  <meta name="theme-color" content="#1c3f66" />
  <link rel="manifest" href="manifest.json" />

  <!-- SEO -->
  <meta name="description" content="Escucha AFRadio en vivo. Música latina, éxitos y entretenimiento 24/7.">
  <meta name="keywords" content="radio online, AFRadio, música latina, radio en vivo">
  <meta name="author" content="AFRadio">

  <!-- OpenGraph -->
  <meta property="og:title" content="AFRadio - La mejor del mundo">
  <meta property="og:description" content="Escucha AFRadio en vivo desde cualquier dispositivo">
  <meta property="og:image" content="AFRadio_logo_512.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jairoacosta-creator.github.io/Afradio/">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-title" content="AFRadio">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: linear-gradient(120deg, #8ea4ad, #488eab, #11b5f2);
  background-size: 300% 300%;
  animation: metallicMove 12s ease-in-out infinite;
  color: white;
  text-align: center;
  padding-top: 30px;
}

@keyframes metallicMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.logo {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  animation: spin 12s linear infinite;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.player {
  margin: 25px auto;
  width: 85%;
  max-width: 400px;
  background: rgba(255,255,255,.15);
  padding: 18px;
  border-radius: 18px;
}

audio {
  width: 100%;
}

#playBtn {
  margin-top: 15px;
  background: #00aaff;
  border: none;
  color: white;
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 1.1em;
  cursor: pointer;
}

.social {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 30px;
}

.social a {
  color: white;
  font-size: 2em;
}
</style>
</head>

<body>

<img src="AFRadio_logo_512.png" class="logo" alt="AFRadio">

<h2>La mejor del mundo</h2>

<!-- ✅ REPRODUCTOR CORREGIDO -->
<div class="player">
  <audio id="radioPlayer" controls preload="none">
    <source src="https://afradio.es/listen/afradio/radio.mp3" type="audio/mpeg">
    Tu navegador no soporta audio en vivo.
  </audio>

  <button id="playBtn">▶ Reproducir</button>
</div>

<div class="social">
  <a href="https://www.facebook.com/afradiolatina" target="_blank"><i class="fab fa-facebook"></i></a>
  <a href="https://tiktok.com/@afradiolatina7" target="_blank"><i class="fab fa-tiktok"></i></a>
  <a href="https://www.instagram.com/afradio2022" target="_blank"><i class="fab fa-instagram"></i></a>
</div>

<footer>© AFRadio 2025</footer>

<script>
const player = document.getElementById("radioPlayer");
const btn = document.getElementById("playBtn");

btn.addEventListener("click", async () => {
  try {
    await player.play();
    btn.textContent = "⏸ Reproduciendo";
  } catch (e) {
    alert("Pulsa nuevamente para iniciar la radio");
  }
});

// Service Worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
